[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zebrafish-ros"
version = "1.0.0"
description = "Within-session normalization and nested analysis of DCF fluorescence in zebrafish embryos"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Emiliano Balderas" }]
keywords = ["dcf", "ros", "zebrafish", "fluorescence", "normalization", "superplot"]
classifiers = [
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "seaborn>=0.13",
]

[project.optional-dependencies]
mixed = ["statsmodels>=0.14"]
dev = ["pytest>=7.4", "statsmodels>=0.14"]

[project.scripts]
zebrafish-ros = "zebrafish_ros.__main__:main"

[tool.setuptools]
packages = ["zebrafish_ros"]

[tool.pytest.ini_options]
testpaths = ["tests"]
